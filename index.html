<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 写作助手 · 智能文案生成</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
.whale { font-size: 48px; display: block; text-align: center; animation: whaleJump 1.4s ease-in-out infinite; }
.whale-text { margin-top: 10px; text-align: center; color: #2b6cb0; font-size: 14px; letter-spacing: 2px; }
@keyframes whaleJump {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  35% { transform: translateY(-24px) rotate(-10deg); }
  50% { transform: translateY(-24px) rotate(10deg); }
  70% { transform: translateY(0) rotate(0deg); }
}
        :root {
            --bg: #050810;
            --text: #ffffff;
            --text-dim: #cbd5e1;
            --accent: #22d3ee;
            --accent-2: #3b82f6;
            --accent-3: #8b5cf6;
        }

        body {
            font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 深海 + 鲸鱼 SVG 场景 ===== */
        #scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        #whale {
            filter: drop-shadow(0 0 20px rgba(109, 90, 224, 0.26));
        }

        /* 柔和发光边缘：亮蓝内圈 → 蓝紫外圈（高斯模糊，非硬描边） */
        .halo { fill: none; }
        .halo-outer {
            stroke: #6d5ae0;
            stroke-width: 7;
            filter: blur(8px);
            animation: haloOuter 5.5s ease-in-out infinite alternate;
        }
        .halo-inner {
            stroke: #59c2ff;
            stroke-width: 2.5;
            filter: blur(2.5px);
            animation: haloInner 5.5s ease-in-out 0.8s infinite alternate;
        }
        @keyframes haloOuter { from { opacity: 0.28; } to { opacity: 0.46; } }
        @keyframes haloInner { from { opacity: 0.6; } to { opacity: 0.88; } }

        /* 身体内星云云团（缓慢漂移，多深度紫色） */
        .neb { transform-box: fill-box; transform-origin: center; }
        .neb-1 { animation: nebDrift1 18s ease-in-out infinite alternate; }
        .neb-2 { animation: nebDrift2 22s ease-in-out infinite alternate; filter: blur(4px); }
        .neb-3 { animation: nebDrift3 15s ease-in-out infinite alternate; }
        .neb-4 { animation: nebDrift2 26s ease-in-out 2s infinite alternate; filter: blur(3px); }
        @keyframes nebDrift1 {
            from { transform: translate(-6px, 2px) scale(1); }
            to { transform: translate(7px, -3px) scale(1.06); }
        }
        @keyframes nebDrift2 {
            from { transform: translate(5px, -2px) scale(1.04); }
            to { transform: translate(-6px, 3px) scale(1); }
        }
        @keyframes nebDrift3 {
            from { transform: translate(4px, 3px); }
            to { transform: translate(-5px, -2px); }
        }
        .belly-sheen { transform-box: fill-box; transform-origin: center; filter: blur(4px); animation: sheenGlow 9s ease-in-out infinite alternate; }
        @keyframes sheenGlow { from { opacity: 0.7; } to { opacity: 1; } }
        .back-shade { filter: blur(6px); }

        /* 体内星点：闪烁 + 双层缓慢流动 */
        .nstar { animation: ntwinkle var(--d, 3s) ease-in-out var(--dl, 0s) infinite; }
        @keyframes ntwinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.8; } }
        .drift-a { animation: driftA 26s ease-in-out infinite alternate; }
        .drift-b { animation: driftB 34s ease-in-out infinite alternate; }
        @keyframes driftA { from { transform: translate(-8px, 3px); } to { transform: translate(10px, -4px); } }
        @keyframes driftB { from { transform: translate(7px, -3px); } to { transform: translate(-9px, 4px); } }

        /* 轮廓高光线 / 眼睛 */
        .edge-line { fill: none; stroke-linecap: round; }
        .eye-glow { filter: blur(2.5px); opacity: 0.5; }

        /* 偶尔摆尾 */
        #tail {
            transform-box: fill-box;
            transform-origin: 92% 50%;
            animation: tailWag 4.6s ease-in-out infinite;
        }

        @keyframes tailWag {
            0%, 55%, 100% { transform: rotate(0deg); }
            65% { transform: rotate(7deg); }
            78% { transform: rotate(-6deg); }
            90% { transform: rotate(3deg); }
        }

        .star { animation: twinkle var(--d, 3s) ease-in-out var(--dl, 0s) infinite; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.85; }
        }

        .bubble { animation: bubbleRise var(--d, 9s) linear var(--dl, 0s) infinite; }

        @keyframes bubbleRise {
            0% { transform: translateY(0); opacity: 0; }
            12% { opacity: 0.4; }
            80% { opacity: 0.28; }
            100% { transform: translateY(var(--rise, -500px)); opacity: 0; }
        }

        .shimmer { animation: shimmerPulse var(--d, 4s) ease-in-out var(--dl, 0s) infinite; }

        @keyframes shimmerPulse {
            0%, 100% { opacity: 0.05; }
            50% { opacity: 0.28; }
        }

        @keyframes waveL {
            from { transform: translateX(0); }
            to { transform: translateX(-1600px); }
        }

        #waveBack { animation: waveL 26s linear infinite; }
        #waveFront { animation: waveL 15s linear infinite; }

        /* 水花与涟漪粒子 */
        #fx ellipse { transform-box: fill-box; transform-origin: center; }

        /* 结果卡片改为「鲸鱼落水后浮现」（由脚本添加 .revealed 联动） */
        #resultCard.show:not(.revealed) { opacity: 0; transform: translateY(24px); }
        #resultCard.revealed { animation: cardPop 0.7s cubic-bezier(0.22, 1, 0.36, 1); }

        @keyframes cardPop {
            0% { transform: translateY(18px) scale(0.97); }
            60% { transform: translateY(-4px) scale(1.015); }
            100% { transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            #tail, .star, .bubble, .shimmer, #waveBack, #waveFront,
            .halo-outer, .halo-inner, .neb-1, .neb-2, .neb-3, .neb-4,
            .belly-sheen, .nstar, .drift-a, .drift-b, .stream-cursor { animation: none; }
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            padding: 70px 0 44px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px;
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.25);
            color: #a5f3fc;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 22px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 24px rgba(34, 211, 238, 0.12), inset 0 1px 0 rgba(255,255,255,0.08);
            animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22d3ee;
            box-shadow: 0 0 10px #22d3ee;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 14px;
            animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.08s backwards;
        }

        .header h1 .gradient-text {
            background: linear-gradient(120deg, #67e8f9 0%, #3b82f6 45%, #a78bfa 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 6s ease infinite;
        }

        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header-sub {
            font-size: 16px;
            color: var(--text-dim);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.7;
            animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.16s backwards;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(26px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 高级玻璃卡片 ===== */
        .form-card {
            position: relative;
            background:
                linear-gradient(160deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0.05) 100%),
                rgba(10, 8, 40, 0.5);
            backdrop-filter: blur(26px) saturate(150%);
            -webkit-backdrop-filter: blur(26px) saturate(150%);
            border: 1px solid rgba(148, 190, 255, 0.16);
            border-radius: 26px;
            padding: 34px;
            margin-bottom: 26px;
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(34, 211, 238, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.4s, box-shadow 0.4s;
            animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.24s backwards;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.55), rgba(167, 139, 250, 0.4), transparent);
        }

        .form-card:hover {
            transform: translateY(-4px);
            border-color: rgba(103, 232, 249, 0.3);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(34, 211, 238, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #dbeafe;
            margin-bottom: 10px;
        }

        .form-label-icon { font-size: 16px; }

        .form-input,
        .form-select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(8, 6, 30, 0.5);
            border: 1px solid rgba(103, 232, 249, 0.18);
            border-radius: 14px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: rgba(34, 211, 238, 0.7);
            background: rgba(8, 6, 30, 0.7);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.12), 0 0 24px rgba(34, 211, 238, 0.08);
        }

        .form-input::placeholder { color: #64748b; }

        .form-select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath fill='%2322d3ee' d='M6 8L0 0h12z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 10px;
            padding-right: 42px;
        }

        .form-select option { background: #14103a; color: var(--text); }

        textarea.form-input {
            min-height: 90px;
            resize: vertical;
            line-height: 1.6;
        }

        /* ===== 类型胶囊 ===== */
        .type-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .type-pill {
            padding: 9px 18px;
            background: rgba(8, 6, 30, 0.45);
            border: 1px solid rgba(103, 232, 249, 0.18);
            border-radius: 50px;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .type-pill:hover {
            border-color: rgba(103, 232, 249, 0.5);
            color: #a5f3fc;
            transform: translateY(-2px);
        }

        .type-pill.active {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(59, 130, 246, 0.18));
            border-color: rgba(34, 211, 238, 0.7);
            color: #fff;
            box-shadow: 0 6px 20px rgba(34, 211, 238, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* ===== 生成按钮 ===== */
        .btn-generate {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6 55%, #8b5cf6);
            background-size: 180% 180%;
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.35s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            position: relative;
            overflow: hidden;
            animation: btnFlow 5s ease infinite;
        }

        @keyframes btnFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .btn-generate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s;
        }

        .btn-generate:hover::before { left: 100%; }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(14, 165, 233, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-generate:active { transform: translateY(0); }

        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-generate.loading {
            background: linear-gradient(135deg, #475569, #334155);
            box-shadow: none;
            animation: none;
        }

        /* ===== 结果卡片 ===== */
        .result-card {
            position: relative;
            background:
                linear-gradient(160deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0.04) 100%),
                rgba(10, 8, 40, 0.5);
            backdrop-filter: blur(26px) saturate(150%);
            -webkit-backdrop-filter: blur(26px) saturate(150%);
            border: 1px solid rgba(148, 190, 255, 0.16);
            border-radius: 26px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .result-card.show { opacity: 1; transform: translateY(0); }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 26px;
            border-bottom: 1px solid rgba(103, 232, 249, 0.12);
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.06), rgba(139, 92, 246, 0.06));
        }

        .result-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            color: #dbeafe;
        }

        .result-title-icon {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
        }

        .btn-copy {
            padding: 8px 18px;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 10px;
            color: #a5f3fc;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy:hover {
            background: rgba(34, 211, 238, 0.2);
            border-color: rgba(34, 211, 238, 0.6);
            color: #fff;
        }

        .btn-copy.copied {
            background: rgba(34, 197, 94, 0.18);
            border-color: rgba(34, 197, 94, 0.55);
            color: #4ade80;
        }

        .result-content {
            padding: 26px;
            font-size: 15px;
            line-height: 1.85;
            color: #ffffff;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 100px;
        }

        /* ===== Loading ===== */
        .loading-dots {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 8px 0;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22d3ee;
            box-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .loading-text {
            color: var(--text-dim);
            font-size: 14px;
            margin-left: 8px;
        }

        /* ===== Error ===== */
        .error-msg {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ===== Stream（流式输出）===== */
        .stream-cursor {
            display: inline-block;
            width: 2px;
            height: 1.05em;
            margin-left: 3px;
            background: #67e8f9;
            box-shadow: 0 0 8px rgba(103, 232, 249, 0.9);
            vertical-align: -0.15em;
            animation: cursorBlink 0.85s steps(1) infinite;
        }
        @keyframes cursorBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .stream-note {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(148, 163, 184, 0.25);
            color: #94a3b8;
            font-size: 12px;
        }
        .stop-btn {
            display: none;
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 14px;
            color: #fca5a5;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s;
        }
        .stop-btn.visible { display: flex; }
        .stop-btn:hover { background: rgba(239, 68, 68, 0.16); }
        .stop-btn:active { transform: scale(0.98); }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 44px 0 50px;
            color: var(--text-dim);
            font-size: 13px;
            animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s backwards;
        }

        .footer .gradient-text {
            background: linear-gradient(135deg, #67e8f9, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .header { padding: 46px 0 32px; }
            .header h1 { font-size: 34px; }
            .header-sub { font-size: 14px; }
            .form-card { padding: 24px; border-radius: 20px; }
            .result-content { padding: 18px; font-size: 14px; }
            .result-header { padding: 14px 18px; }
        }
    </style>
</head>
<body>
    <!-- 深海 + 鲸鱼 SVG 场景 -->
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#050a26"/>
                <stop offset="55%" stop-color="#141a4e"/>
                <stop offset="100%" stop-color="#2c1b60"/>
            </linearGradient>
            <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#342072"/>
                <stop offset="45%" stop-color="#1d1252"/>
                <stop offset="100%" stop-color="#0c0730"/>
            </linearGradient>
            <linearGradient id="whaleGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0e153d"/>
                <stop offset="55%" stop-color="#262368"/>
                <stop offset="100%" stop-color="#4b3fa6"/>
            </linearGradient>
            <radialGradient id="nebViolet">
                <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.38"/>
                <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="nebLav">
                <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.32"/>
                <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="nebIndigo">
                <stop offset="0%" stop-color="#4c3a9e" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#4c3a9e" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="sheen">
                <stop offset="0%" stop-color="#9db8ff" stop-opacity="0.24"/>
                <stop offset="100%" stop-color="#9db8ff" stop-opacity="0"/>
            </radialGradient>

    <script>
        // ===== 配置 =====
        const API_URL = 'https://api.siliconflow.cn/v1/chat/completions';

        const MODEL = 'Qwen/Qwen2.5-14B-Instruct';

        // ===== DOM =====
        const topicInput = document.getElementById('topic');

        let currentType = '小红书文案';
        let controller = null;   // 流式请求的中止控制器
        let currentPrompt = '';

        // ===== 类型选择 =====
        typePills.addEventListener('click', (e) => {
            const pill = e.target.closest('.type-pill');

            pill.classList.add('active');

        // 初始化默认 prompt
        currentPrompt = document.querySelector('.type-pill.active').dataset.prompt;

        // ===== 生成文案 =====
        generateBtn.addEventListener('click', async () => {
            const topic = topicInput.value.trim();
            if (!topic) {
                topicInput.focus();
                topicInput.style.borderColor = '#ef4444';
                setTimeout(() => { topicInput.style.borderColor = ''; }, 1500);
                return;
            }

            // 显示加载状态
            generateBtn.disabled = true;
            generateBtn.classList.add('loading');
            stopBtn.classList.add('visible');
            controller = new AbortController();
            generateBtn.innerHTML = `
                <div class="loading-dots"><span></span><span></span><span></span></div>
                <span class="loading-text">AI 正在创作中...</span>
            `;

            // 显示结果卡片（加载状态）
            resultCard.classList.add('show');
            resultTitle.textContent = currentType;
            resultContent.innerHTML = `
                <div class="whale">🐳</div>
                <span class="loading-text"></span>
            `;
            resultContent.querySelector('.loading-text').textContent = `正在生成「${topic}」的${currentType}...`;

            try {
    const systemPrompt = currentType === '小红书文案'
      ? '你是一位小红书爆款文案写手。根据用户给的主题，写一篇种草文案，要求：\n- 开头用 emoji 抓眼球\n- 分点列出核心卖点\n- 语气亲切活泼，像闺蜜在推荐\n- 结尾必须以话题标签收尾，格式严格为：#主题词 #相关词1 #相关词2（2~4 个中文话题标签，第一个必须是主题词，其余与主题强相关）\n- 严禁输出 GROUND 或其他任何无意义的英文单词；除话题标签外全文必须为中文\n- 适当用 emoji 点缀，别堆太多\n- 严禁重复输出同样的字词或句子，全文总字数严格控制在 150 字以内'
      : '你是一位专业的中文小红书文案写手。根据用户给的主题和类型，写一段自然流畅、口语化的种草文案，100字左右，不要重复、不要罗列数字编号，直接输出文案正文。严禁重复输出同样的字词或句子，全文总字数严格控制在 150 字以内。';
    const userMessage = currentType === '小红书文案' ? `主题：${topic}` : `${currentPrompt}\n\n主题：${topic}`;
    const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY,
                    },
                    signal: controller.signal,
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userMessage }
                        ],
                        temperature: 0.6,
                        max_tokens: 300,
                        top_p: 0.8,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `请求失败（${response.status}）`);
                }

                // ===== 流式读取（SSE）：逐块追加，打字机效果 =====
                resultContent.innerHTML = `
                    <span class="stream-text"></span><span class="stream-cursor"></span>
                `;
                const streamSpan = resultContent.querySelector('.stream-text');
                const cursorSpan = resultContent.querySelector('.stream-cursor');

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let fullText = '';
                let firstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();                       // 保留半截行，下轮拼接
                    for (const line of lines) {
                        const t = line.trim();
                        if (!t.startsWith('data:')) continue;
                        const payload = t.slice(5).trim();
                        if (payload === '[DONE]') continue;
                        try {
                            const delta = JSON.parse(payload).choices?.[0]?.delta?.content || '';
                            if (!delta) continue;
                            if (firstChunk) {
                                firstChunk = false;
                                startDive();                    // 输出开始 → 鲸鱼落水，过渡完成
                            }
                            fullText += delta;
                            streamSpan.textContent = fullText;  // 实时追加（textContent 防注入）
                        } catch (e) { /* 分片 JSON 不完整，忽略 */ }
                    }
                }

                if (!fullText.trim()) throw new Error('接口返回内容为空，请稍后重试。');

                // 后处理过滤：删除模型偶发幻觉的无意义英文词（如 GROUND），并收束多余空白
                let cleaned = fullText.replace(/GROUND/gi, '').replace(/[ \t]{2,}/g, ' ').replace(/[ \t]+$/gm, '').trim();
                if (!cleaned) cleaned = fullText;

                streamSpan.textContent = cleaned;
                cursorSpan.remove();
                resultContent.dataset.content = cleaned;

            } catch (err) {
                if (err.name === 'AbortError' || (controller && controller.signal.aborted)) {
                    // 用户手动停止：保留已生成的部分内容
                    const partial = resultContent.querySelector('.stream-text');
                    const text = partial ? partial.textContent.trim() : '';
                    if (text) {
                        let cleaned = text.replace(/GROUND/gi, '').replace(/[ \t]{2,}/g, ' ').replace(/[ \t]+$/gm, '').trim();
                        if (!cleaned) cleaned = text;
                        partial.textContent = cleaned;
                        resultContent.dataset.content = cleaned;
                        const note = document.createElement('div');
                        note.className = 'stream-note';
                        note.textContent = '⏹ 已停止生成，以上为已输出内容';
                        resultContent.appendChild(note);
                    } else {
                        resultContent.innerHTML = '<div class="error-msg">⏹ 已停止生成。</div>';
                    }
                } else {
                    let hint = '';
                    if (err.message.includes('401')) hint = '\n\n提示：请检查后端 API Key 配置是否正确。';
                    else if (err.message.includes('Failed to fetch')) hint = '\n\n提示：网络连接失败，请检查网络或接口地址。';

                    resultContent.innerHTML = `
                        <div class="error-msg">
                            ❌ ${err.message}${hint}
                        </div>
                    `;
                }
            } finally {
                generateBtn.disabled = false;
                generateBtn.classList.remove('loading');
                generateBtn.innerHTML = '<span>✨ 生成文案</span>';
                stopBtn.classList.remove('visible');
                const cursor = resultContent.querySelector('.stream-cursor');
                if (cursor) cursor.remove();
                controller = null;
            }
        });

        // ===== 停止生成 =====
        stopBtn.addEventListener('click', () => {
            if (controller) controller.abort();
        });

        // ===== 复制 =====
        copyBtn.addEventListener('click', async () => {
            const content = resultContent.dataset.content || resultContent.textContent;
            if (!content || content.includes('❌')) return;

            try {
                await navigator.clipboard.writeText(content);
                markCopied();
            } catch (e) {
                // 降级方案
                const ta = document.createElement('textarea');
                ta.value = content;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                markCopied();
            }
        });

        function markCopied() {
            copyBtn.classList.add('copied');
            copyText.textContent = '已复制';
            copyBtn.querySelector('span:first-child').textContent = '✓';
            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyText.textContent = '复制';
                copyBtn.querySelector('span:first-child').textContent = '📋';
            }, 2000);
        }

        // ===== 回车快捷键（Ctrl/Cmd + Enter）=====
        topicInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                generateBtn.click();
            }
        });

        /* ==========================================================
           🐋 深海 + 剪影鲸鱼场景（SVG + CSS 动画 + 少量 JS）
           - 平时水下缓游 + 偶尔摆尾（CSS）
           - 鼠标移动 → 鲸鱼轻微跟随 + 水面涟漪
           - 点击生成 → 鲸鱼跃出水面划弧（ease-in-out ~1.6s）空中悬停
           - 生成完成 → 落水 + 水花 + 涟漪扩散 + 结果卡片浮现
        ========================================================== */
        (function () {
            const NS = 'http://www.w3.org/2000/svg';
            const svg = document.getElementById('scene');
            const whaleG = document.getElementById('whale');
            const seaG = document.getElementById('sea');
            const starsG = document.getElementById('stars');
            const bubblesG = document.getElementById('bubbles');
            const shimmerG = document.getElementById('shimmer');
            const fxG = document.getElementById('fx');
            const waveBack = document.getElementById('waveBack');
            const waveFront = document.getElementById('waveFront');
            const skyRect = document.getElementById('skyRect');
            const seaRect = document.getElementById('seaRect');
            const resultCard = document.getElementById('resultCard');
            const resultContent = document.getElementById('resultContent');
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            let W = 0, H = 0, waterY = 0, depth = 0, inited = false;

            // ---- 波浪路径（周期 160px，可无限平铺滚动）----
            function wavePathD(amp) {
                const w = Math.ceil((W * 2 + 1800) / 160) * 160;
                let d = 'M0 0';
                for (let x = 0; x < w; x += 160) {
                    d += ` q 40 ${-amp * 2} 80 0 q 40 ${amp * 2} 80 0`;
                }
                d += ` L ${w} ${depth} L 0 ${depth} Z`;
                return d;
            }

            function rnd(a, b) { return a + Math.random() * (b - a); }

            function buildStars() {
                let html = '';
                for (let i = 0; i < 42; i++) {
                    html += `<circle class="star" cx="${rnd(0, W).toFixed(1)}" cy="${(waterY * rnd(0.05, 0.85)).toFixed(1)}" r="${rnd(0.6, 1.6).toFixed(2)}" fill="#cfe3ff" style="--d:${rnd(2, 5).toFixed(1)}s;--dl:${rnd(0, 4).toFixed(1)}s"/>`;
                }
                starsG.innerHTML = html;
            }

            function buildBubbles() {
                let html = '';
                for (let i = 0; i < 9; i++) {
                    const cy = waterY + depth * rnd(0.35, 0.92);
                    const rise = (cy - (waterY + 10)).toFixed(0);
                    html += `<circle class="bubble" cx="${rnd(0, W).toFixed(1)}" cy="${cy.toFixed(1)}" r="${rnd(2, 4.5).toFixed(1)}" fill="none" stroke="rgba(140,200,255,0.35)" stroke-width="1" style="--rise:-${rise}px;--d:${rnd(6, 13).toFixed(1)}s;--dl:${rnd(0, 10).toFixed(1)}s"/>`;
                }
                bubblesG.innerHTML = html;
            }

            function buildShimmer() {
                let html = '';
                for (let i = 0; i < 5; i++) {
                    html += `<ellipse class="shimmer" cx="${rnd(0, W).toFixed(1)}" cy="${rnd(5, 20).toFixed(1)}" rx="${rnd(40, 120).toFixed(0)}" ry="2.5" fill="rgba(140,220,255,0.5)" style="--d:${rnd(3, 6).toFixed(1)}s;--dl:${rnd(0, 4).toFixed(1)}s"/>`;
                }
                shimmerG.innerHTML = html;
            }

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                waterY = Math.round(H * 0.72);
                depth = H - waterY + 60;
                svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
                skyRect.setAttribute('width', W);
                skyRect.setAttribute('height', H);
                seaG.setAttribute('transform', `translate(0 ${waterY})`);
                seaRect.setAttribute('y', -26);
                seaRect.setAttribute('width', W);
                seaRect.setAttribute('height', depth + 26);
                waveBack.setAttribute('d', wavePathD(9));
                waveFront.setAttribute('d', wavePathD(13));
                buildStars();
                buildBubbles();
                buildShimmer();
                if (!inited) {
                    whale.x = W * 0.42;
                    whale.y = waterY + 90;
                    inited = true;
                }
                whale.x = Math.min(Math.max(whale.x, 100), W - 100);
                whale.y = Math.min(whale.y, H - 90);
            }

            // ---- 鲸鱼状态机 ----
            const whale = {
                x: 0, y: 0, a: 0,        // 当前位置与角度
                phase: 'idle',           // idle | leap | hover | dive
                p: 0,                    // 相位进度
                sx: 0, sy: 0,            // 相位起点
                ax: 0, ay: 0,            // 跃起顶点
                ex: 0,                   // 落水点
                cx: 0, cy: 0,            // 贝塞尔控制点
                prevY: 0,
                revealPending: false
            };
            let mx = null, my = null;
            let lastRipple = 0;
            let safetyTimer = null;
            let diveTriggered = false;   // 流式输出期间 DOM 持续变化，落水只触发一次
            let nextSpout = performance.now() + 2500;

            const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            const easeInCubic = t => t * t * t;
            const quad = (t, a, b, c) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
            const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

            // ---- 特效：涟漪 ----
            function ripple(x, big) {
                const e = document.createElementNS(NS, 'ellipse');
                e.setAttribute('cx', x);
                e.setAttribute('cy', waterY + 4);
                e.setAttribute('rx', big ? 70 : 34);
                e.setAttribute('ry', big ? 13 : 7);
                e.setAttribute('fill', 'none');
                e.setAttribute('stroke', 'rgba(147,214,255,0.55)');
                e.setAttribute('stroke-width', big ? 2 : 1.2);
                fxG.appendChild(e);
                const anim = e.animate([
                    { transform: 'scale(0.15)', opacity: 0.7 },
                    { transform: `scale(${big ? 3.2 : 1.8})`, opacity: 0 }
                ], { duration: big ? 1600 : 800, easing: 'cubic-bezier(.22,1,.36,1)' });
                anim.onfinish = () => e.remove();
            }

            // ---- 特效：水花 ----
            function splash(x) {
                ripple(x, true);
                setTimeout(() => ripple(x, false), 150);
                setTimeout(() => ripple(x, false), 320);
                for (let i = 0; i < 14; i++) {
                    const c = document.createElementNS(NS, 'circle');
                    c.setAttribute('cx', x + rnd(-15, 15));
                    c.setAttribute('cy', waterY + 2);
                    c.setAttribute('r', rnd(1.5, 3.8));
                    c.setAttribute('fill', 'rgba(191,227,255,0.9)');
                    fxG.appendChild(c);
                    const dx = rnd(-45, 45), up = rnd(40, 130);
                    const anim = c.animate([
                        { transform: 'translate(0,0)', opacity: 1 },
                        { transform: `translate(${dx * 0.6}px,${-up}px)`, opacity: 1, offset: 0.45 },
                        { transform: `translate(${dx}px,${rnd(18, 38)}px)`, opacity: 0 }
                    ], { duration: rnd(750, 1100), easing: 'cubic-bezier(.22,.9,.36,1)' });
                anim.onfinish = () => c.remove();
                }
            }

            // ---- 喷气孔星柱：局部坐标 → 世界坐标（含旋转/缩放） ----
            function transformPoint(lx, ly) {
                const s = W < 640 ? 0.62 : 0.85;
                const r = whale.a * Math.PI / 180;
                const cos = Math.cos(r), sin = Math.sin(r);
                return {
                    x: whale.x + s * (lx * cos - ly * sin),
                    y: whale.y + s * (lx * sin + ly * cos)
                };
            }

            // 喷出一柱上升的星星光点（与背景星空呼应）
            function spout() {
                const p = transformPoint(48, -46);   // 喷气孔位置（头顶）
                // 雾柱
                const mist = document.createElementNS(NS, 'circle');
                mist.setAttribute('cx', p.x);
                mist.setAttribute('cy', p.y);
                mist.setAttribute('r', 6);
                mist.setAttribute('fill', 'rgba(159,214,255,0.28)');
                mist.style.filter = 'blur(3px)';
                fxG.appendChild(mist);
                mist.animate([
                    { transform: 'translate(0,0) scale(0.6)', opacity: 0.8 },
                    { transform: 'translate(0,-26px) scale(2.2)', opacity: 0 }
                ], { duration: 1300, easing: 'ease-out' }).onfinish = () => mist.remove();
                // 上升星光
                const colors = ['#cfe3ff', '#b39dff', '#8fd8ff'];
                for (let i = 0; i < 7; i++) {
                    setTimeout(() => {
                        const st = document.createElementNS(NS, 'circle');
                        st.setAttribute('cx', p.x + rnd(-3, 3));
                        st.setAttribute('cy', p.y);
                        st.setAttribute('r', rnd(0.7, 1.6));
                        st.setAttribute('fill', colors[i % 3]);
                        fxG.appendChild(st);
                        const dx = rnd(-7, 7), h = rnd(30, 64);
                        st.animate([
                            { transform: 'translate(0,0)', opacity: 0 },
                            { opacity: 0.95, offset: 0.25 },
                            { transform: `translate(${dx}px,${-h}px)`, opacity: 0 }
                        ], { duration: rnd(1200, 1900), easing: 'cubic-bezier(.3,.6,.4,1)' }).onfinish = () => st.remove();
                    }, i * rnd(60, 130));
                }
            }

            function revealCard() {
                resultCard.classList.add('revealed');
            }

            // ---- 联动：开始跃起（点击生成时触发）----
            function startLeap() {
                if (whale.phase !== 'idle') return;
                diveTriggered = false;
                resultCard.classList.remove('revealed');
                whale.sx = whale.x;
                whale.sy = whale.y;
                whale.ax = clamp(whale.x + 140, 140, W * 0.78);
                whale.ay = waterY - Math.min(H * 0.26, 230);
                whale.cx = (whale.sx + whale.ax) / 2;
                whale.cy = Math.min(whale.sy, whale.ay) - 80;
                whale.p = 0;
                whale.phase = 'leap';
                // 安全兜底：15 秒未收到完成信号则自动落水
                clearTimeout(safetyTimer);
                safetyTimer = setTimeout(() => {
                    if (whale.phase === 'leap' || whale.phase === 'hover') startDive();
                }, 15000);
            }

            // ---- 联动：落水（生成完成时触发）----
            function startDive() {
                if (diveTriggered) return;
                diveTriggered = true;
                clearTimeout(safetyTimer);
                whale.revealPending = true;
                if (whale.phase === 'idle') {
                    // 鲸鱼还在水下（未捕获到跃起）→ 只做水面涟漪 + 卡片浮现
                    ripple(clamp(whale.x, 120, W - 120), true);
                    revealCard();
                    return;
                }
                whale.sx = whale.x;
                whale.sy = whale.y;
                whale.ex = clamp(whale.x + 110, 120, W - 120);
                whale.cx = whale.x + 30;
                whale.cy = waterY - 70;
                whale.p = 0;
                whale.phase = 'dive';
            }

            // ---- 联动入口：监听结果区 DOM 变化（不改任何现有逻辑）----
            new MutationObserver(muts => {
                for (const m of muts) {
                    for (const n of m.addedNodes) {
                        if (n.nodeType === 1) {
                            if (n.classList && n.classList.contains('loading-dots')) { startLeap(); return; }
                            if (n.classList && n.classList.contains('error-msg')) { startDive(); return; }
                        } else if (n.nodeType === 3 && n.textContent.trim().length > 10) {
                            startDive();
                            return;
                        }
                    }
                }
            }).observe(resultContent, { childList: true, characterData: true, subtree: true });

            // ---- 鼠标：鲸鱼轻微跟随 + 水面涟漪 ----
            window.addEventListener('pointermove', (e) => {
                mx = e.clientX;
                my = e.clientY;
                const now = performance.now();
                if (now - lastRipple > 180 && mx > 0 && mx < W) {
                    lastRipple = now;
                    if (!reduce) ripple(mx, false);
                }
            }, { passive: true });

            // ---- 主循环（仅驱动鲸鱼一个元素，性能轻）----
            let last = performance.now();
            function frame(now) {
                const dt = Math.min(now - last, 50);
                last = now;

                let tx, ty, ta;
                if (whale.phase === 'idle') {
                    const wanderX = W * 0.5 + Math.sin(now * 0.00012) * W * 0.18;
                    tx = mx !== null ? clamp(mx, 120, W - 120) : wanderX;
                    ty = waterY + depth * 0.32
                       + (my !== null ? clamp((my - waterY) * 0.12, -30, 60) : 0)
                       + Math.sin(now * 0.0011) * 8;
                    ty = clamp(ty, waterY + 46, H - 100);
                    ta = Math.sin(now * 0.0009) * 5 + (ty - whale.y) * 0.06;
                    const k = 1 - Math.exp(-dt * 0.0022);
                    whale.x += (tx - whale.x) * k;
                    whale.y += (ty - whale.y) * k;
                    whale.a += (ta - whale.a) * 0.05;
                    if (now > nextSpout) { spout(); nextSpout = now + rnd(3800, 6200); }
                } else if (whale.phase === 'leap') {
                    whale.p += dt / 1600;                       // 跃出 ~1.6s，ease-in-out
                    const e = easeInOutCubic(Math.min(whale.p, 1));
                    whale.x = quad(e, whale.sx, whale.cx, whale.ax);
                    whale.y = quad(e, whale.sy, whale.cy, whale.ay);
                    ta = -38 * (1 - e) - 4 * e;
                    whale.a += (ta - whale.a) * 0.15;
                    if (whale.p >= 1) {
                        whale.phase = 'hover';
                        spout();                                   // 跃至顶点，喷一柱星光
                        nextSpout = now + rnd(4000, 6500);
                    }
                } else if (whale.phase === 'hover') {
                    whale.x += 0.012 * dt;                      // 顶点短暂停留，缓缓前飘
                    whale.y = whale.ay + Math.sin(now * 0.003) * 5;
                    ta = -4 + Math.sin(now * 0.003) * 2;
                    whale.a += (ta - whale.a) * 0.1;
                    whale.x = Math.min(whale.x, W * 0.8);
                    if (now > nextSpout) { spout(); nextSpout = now + rnd(4200, 6800); }
                } else if (whale.phase === 'dive') {
                    whale.p += dt / 1150;                       // 落水 ~1.15s
                    const e = easeInCubic(Math.min(whale.p, 1));
                    whale.prevY = whale.y;
                    whale.x = quad(e, whale.sx, whale.cx, whale.ex);
                    whale.y = quad(e, whale.sy, whale.cy, waterY + 70);
                    ta = -4 + 46 * e;
                    whale.a += (ta - whale.a) * 0.15;
                    if (whale.prevY < waterY && whale.y >= waterY) {
                        splash(whale.x);                        // 入水：水花 + 涟漪
                        if (whale.revealPending) {
                            whale.revealPending = false;
                            revealCard();                       // 结果卡片随之浮现
                        }
                    }
                    if (whale.p >= 1) whale.phase = 'idle';
                }

                const s = W < 640 ? 0.62 : 0.85;
                whaleG.setAttribute('transform',
                    `translate(${whale.x.toFixed(1)} ${whale.y.toFixed(1)}) rotate(${whale.a.toFixed(1)}) scale(${s})`);

                requestAnimationFrame(frame);
            }

            resize();
            window.addEventListener('resize', resize);

            if (reduce) {
                // 减少动态：静态摆放，不做跃起动画，仅保留卡片浮现
                whale.x = W * 0.55;
                whale.y = waterY + 80;
                whaleG.setAttribute('transform', `translate(${whale.x} ${whale.y}) scale(0.8)`);
            } else {
                requestAnimationFrame(frame);
            }
        })();
    </script>
</body>
</html>
